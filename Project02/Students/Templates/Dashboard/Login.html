<!DOCTYPE html>
<html>
    <head>
        <title>
            Log In 
        </title>
        <style>
            body{
                background-color:white;
                padding: 150px;
                border: 5px solid black;
            }
            h2{
                color: black;
                background-color: aqua;
                padding: 10px;
                border-radius: 1px;
                border: 1px solid black;
            }
            form{
                padding: 25px;
                border-radius: 1px;
                border: 1px solid black;
            }
            button:hover{
                background-color: aqua;
                color: black;
                transform: 03.ms;
                transition: 03.ms;
            }
            nav
            {
                background-color: aquamarine;
                padding: 25px;
                border-radius: 1px;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <center>  
            <br>
            <br>
            <nav>
                <button><a href="http://127.0.0.1:8000/Students/About/" target="_self">About</a></button> | 
                <button><a href="http://127.0.0.1:8000/Students/Login/" target="_self">Log In</a></button> | 
                <button><a href="http://127.0.0.1:8000/Students/Signup/" target="_self">Sign Up</a></button> |
                <button><a href="http://127.0.0.1:8000/Students/Contact/" target="_self">Contact</a></button>
            </nav>
            <br>
            <br>
        <hr size="1px" color="blue">
        <h2>Log In</h2>
        <hr size="1" color="blue">
        <form>
            <label for="UserName">UserName</label>
            <br>
            <br>
            <input type="text" placeholder="Enter UserName">
            <br>
            <br>
            <label for="Password">Password</label>
            <br>
            <br>
            <input type="password" placeholder="Enter Password">
            <br>
            <br>
            <button>Log In</button>
            <br>
            <br>
            Don't Have Account <a href="http://127.0.0.1:8000/Students/Signup/" target="_self">Sign Up</a>
        </form>
        <hr size="1" color="blue">
        </center>
    </body>
</html>
