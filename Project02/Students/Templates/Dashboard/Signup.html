<!DOCTYPE html>
<html>
    <head>
        <title>
            Sign Up
        </title>
        <style>
            body{
                background-color:white;
                padding: 50px;
                border: 2px solid black;
            }
            h2{
                color: black;
                background-color: aqua;
                padding: 10px;
                border-radius: 1px;
                border: 1px solid black;
            }
            form{
                padding: 25px;
                border-radius: 1px;
                border: 1px solid black;
            }
            button:hover{
                background-color: aqua;
                color: black;
                transform: 03.ms;
                transition: 03.ms;
            }
            nav
            {
                background-color: aquamarine;
                padding: 25px;
                border-radius: 1px;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <center>
            <br>
            <br>
            <nav>
                <button><a href="http://127.0.0.1:8000/Students/About/" target="_self">About</a></button> | 
                <button><a href="http://127.0.0.1:8000/Students/Login/" target="_self">Log In</a></button> | 
                <button><a href="http://127.0.0.1:8000/Students/Signup/" target="_self">Sign Up</a></button> |
                <button><a href="http://127.0.0.1:8000/Students/Contact/" target="_self">Contact</a></button>
            </nav>
            <br>
            <br>
            <hr size="'1" color="red">
            <h2>Sign Up</h2>
            <hr size="'1" color="red">
            <form>
                <label for="Name">Name</label>
                <br>
                <br>
                <input type="text" placeholder="Enter your Full Name">
                <br>
                <br>
                <label for="Email">Email</label>
                <br>
                <br>
                <input type="email" placeholder="Enter your Email">
                <br>
                <br>
                <label for="Password">Password</label>
                <br>
                <br>
                <input type="password" placeholder="Enter your Password">
                <br>
                <br>
                <label for="Confirm Password">Confirm Password</label>
                <br>
                <br>
                <input type="password" placeholder="Enter your Password Again">
                <br>
                <br>
                <label for="Mobile No">Mobile No</label>
                <br>
                <br>
                <input type="number" placeholder="Enter your mobile no">
                <br>
                <br>
                <label for="Select Gender">Select Gender</label>
                <br>
                <br>
                <select id="gender">
                    <option value="Select Gender">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <br>
                <br>
                <button>Sign Up</button>
                <br>
                <br>
                Already Have Account <a href="http://127.0.0.1:8000/Students/Login/" target="_self">Log in</a>
            </form>
            <hr size="'1" color="red">
        </center>
    </body>
</html>
