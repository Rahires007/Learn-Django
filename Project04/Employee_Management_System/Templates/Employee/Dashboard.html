<!DOCTYPE html>
<html>
    <head>
        <title>
            Employee Management System
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <center>
            <hr>
            <h2>Employee Dashboard</h2>
            <hr>
            <table border="1" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th>Employee City</th>
                        <th>Employee Salary</th>
                        <th>Joining Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {%for Employee in Employees%}
                    <tr>
                        <td>{{Employee.Emp_Id}}</td>
                        <td>{{Employee.Name}}</td>
                        <td>{{Employee.City}}</td>
                        <td>{{Employee.Salary}}</td>
                        <td>{{Employee.Date}}</td>
                        <td>
                            <a href="{% url 'Delete' Employee.pk %}"><button type="button" class="btn btn-danger">Delete</button></a>
                            <a href="{% url 'Update' Employee.pk %}"><button type="button" class="btn btn-warning">Edit</button></a>
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
            <hr>
            <a href="{% url 'Form' %}"><button type="button" class="btn btn-success">Add Employee</button></a>
        </center>
    </body>
</html>
