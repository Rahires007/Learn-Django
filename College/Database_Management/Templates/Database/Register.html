<!DOCTYPE html> <html> <head> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

<title>
    Register
</title>

<style>
    header {
        padding: auto;
        border: 2px solid black;
        margin: auto;
    }

    form {
        border: 2px solid black;
        padding: auto;
    }

    .College {
        color: white;
    }
</style>

</head> <body>
<header>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">

        <div align="left">
            <h3 class="College">
                Mgms College Of Computer Science & IT Nanded
            </h3>
        </div>

        <div align="right">

            <a href="http://127.0.0.1:8000/">
                <button class="btn btn-dark">Home</button>
            </a> |

            <a href="http://127.0.0.1:8000/Register/">
                <button class="btn btn-dark">Register</button>
            </a> |

            <a href="http://127.0.0.1:8000/Courses/">
                <button class="btn btn-dark">Courses</button>
            </a> |

            <a href="http://127.0.0.1:8000/Inquary/">
                <button class="btn btn-dark">Inquary</button>
            </a> |

            <a href="http://127.0.0.1:8000/admin/">
                <button class="btn btn-dark">Admin</button>
            </a>

        </div>

    </nav>
</header>


<section align="center">

    <hr size="2px" color="red">

    <h2>Register</h2>

    <hr size="2px" color="red">

    <form method="post">

        {% csrf_token %}

        <label for="Name">Name</label>
        <br>
        <br>

        <input type="text" name="Name" id="Name">

        <br>
        <br>

        <label for="Class">Class</label>
        <br>
        <br>

        <input type="text" name="Class" id="Class">

        <br>
        <br>

        <label for="Course">Course</label>
        <br>
        <br>

        <input type="text" name="Course" id="Course">

        <br>
        <br>

        <label for="Mentor">Mentor</label>
        <br>
        <br>

        <input type="text" name="Mentor" id="Mentor">

        <br>
        <br>

        <label for="MobileNo">Mobile No</label>
        <br>
        <br>

        <input type="text" name="MobileNo" id="MobileNo">

        <br>
        <br>

        <button type="submit" class="btn btn-primary">
            Register
        </button>

        |

        <button type="reset" class="btn btn-secondary">
            Reset
        </button>

    </form>

    <hr size="2px" color="red">

</section>


<!-- ================= DIFFERENT BOOTSTRAP FOOTER ================= -->

<footer class="bg-primary text-white mt-5">

    <div class="container py-4">

        <div class="row align-items-center">

            <!-- College Name -->
            <div class="col-md-6 text-center text-md-start">

                <h5 class="fw-bold">
                    MGMS College Of Computer Science & IT
                </h5>

                <p class="mb-0">
                    Nanded, Maharashtra
                </p>

            </div>


            <!-- Social / Quick Info -->
            <div class="col-md-6 text-center text-md-end mt-3 mt-md-0">

                <a href="#" class="btn btn-light btn-sm me-2">
                    Facebook
                </a>

                <a href="#" class="btn btn-light btn-sm me-2">
                    Instagram
                </a>

                <a href="#" class="btn btn-light btn-sm">
                    LinkedIn
                </a>

            </div>

        </div>


        <hr class="my-4">


        <!-- Footer Bottom -->
        <div class="row">

            <div class="col-md-6 text-center text-md-start">

                <small>
                    © 2026 MGMS College. All Rights Reserved.
                </small>

            </div>

            <div class="col-md-6 text-center text-md-end">

                <small>
                    Designed using Bootstrap 5
                </small>

            </div>

        </div>

    </div>

</footer>

</body> </html>
