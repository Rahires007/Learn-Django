<!DOCTYPE html>
<html>
    <head>
        <title>
            Students Management System
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <center>
            <hr>
            <h2>Students Dashboard</h2>
            <hr>
            <table border="1" class="table table-hover" >
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Student Class</th>
                        <th>Student City</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for Students in Data %}
                    <tr>
                        <td>{{Students.Name}}</td>
                        <td>{{Students.Class}}</td>
                        <td>{{Students.City}}</td>
                        <td>
                            <a href="{% url 'Delete' Students.pk %}"><button class="btn btn-danger">Delete</button></a>
                            <a href="{% url 'Update' Students.pk %}"><button class="btn btn-info">Update</button></a>
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
            <hr>
            <a href="{% url 'Form' %}"><button class="btn btn-success">Add Students</button></a>
        </center>
    </body>
</html>
